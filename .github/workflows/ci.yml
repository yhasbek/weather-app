name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [country-service, city-service, weather-service, gateway]
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - name: Kodu indir
        uses: actions/checkout@v4

      - name: Java 25 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: ${{ matrix.service }}/pom.xml

      - name: Testleri çalıştır
        run: ./mvnw -B verify

  docker:
    name: Docker imajları
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Kodu indir
        uses: actions/checkout@v4

      - name: Tüm imajları derle
        run: docker compose build