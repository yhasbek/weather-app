services:

  # ---------- Veritabanları ----------

  country-db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: countrydb
      POSTGRES_USER: country
      POSTGRES_PASSWORD: ${COUNTRY_DB_PASSWORD:-country}
    volumes:
      - country-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U country -d countrydb"]
      interval: 5s
      timeout: 3s
      retries: 10

  city-db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: citydb
      POSTGRES_USER: city
      POSTGRES_PASSWORD: ${CITY_DB_PASSWORD:-city}
    volumes:
      - city-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U city -d citydb"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ---------- Servisler ----------

  country-service:
    build: ./country-service
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://country-db:5432/countrydb
      SPRING_DATASOURCE_USERNAME: country
      SPRING_DATASOURCE_PASSWORD: ${COUNTRY_DB_PASSWORD:-country}
    depends_on:
      country-db:
        condition: service_healthy

  city-service:
    build: ./city-service
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://city-db:5432/citydb
      SPRING_DATASOURCE_USERNAME: city
      SPRING_DATASOURCE_PASSWORD: ${CITY_DB_PASSWORD:-city}
    depends_on:
      city-db:
        condition: service_healthy

  weather-service:
    build: ./weather-service
    restart: unless-stopped
    environment:
      SERVICES_CITY_BASE_URL: http://city-service:8082

  gateway:
    build: ./gateway
    restart: unless-stopped
    environment:
      COUNTRY_SERVICE_URL: http://country-service:8081
      CITY_SERVICE_URL: http://city-service:8082
      WEATHER_SERVICE_URL: http://weather-service:8083
    ports:
      - "${APP_PORT:-8080}:8080"

volumes:
  country-db-data:
  city-db-data: