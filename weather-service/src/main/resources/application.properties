spring.application.name=weather-service
server.port=8083

# Konuşacağımız servislerin adresleri
services.city.base-url=http://localhost:8082
open-meteo.base-url=https://api.open-meteo.com

# Önbellek: en fazla 500 şehir, her kayıt 30 dakika geçerli
spring.cache.cache-names=forecasts
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=30m
