spring.application.name=weather-service
server.port=8083

# Konuşacağımız servislerin adresleri
services.city.base-url=http://localhost:8082
visual-crossing.base-url=https://weather.visualcrossing.com

# API anahtarı ortam değişkeninden gelir (VISUAL_CROSSING_API_KEY)
visual-crossing.api-key=

# Önbellek: en fazla 500 şehir, her kayıt 3 saat geçerli
spring.cache.cache-names=forecasts
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=3h